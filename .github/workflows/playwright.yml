name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Execução diária (06:00 BRT) para detectar mudanças no site
  schedule:
    - cron: '0 9 * * *'

permissions: 
  contents: read

jobs:
  test:
    name: Testes E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O chromium é sempre necessário: o projeto "setup" (login) roda nele
      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium ${{ matrix.project }}

      - name: Rodar testes
        run: npx playwright test --project=${{ matrix.project }}

      - name: Publicar relatório HTML
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
